# SUPERSEDED by SPEC-API-004 (3rd architect-review pass found AC-8/AC-7 didn't cover the
# Course->Deadline cascade or Note-unlink cascade decided in SPEC-CORE-005). Kept for
# historical audit-trail purposes only.
id: SPEC-API-003
version: 0.1.0
kind: api
title: Personal Assistant application API surface
status: deprecated
context_and_scope:
  in_scope:
    - Collection and id-addressed CRUD routes for Course, Deadline, Task, Note backed by SPEC-DATA-004's tables (list/create at the collection route, get/update/soft-delete at the id-addressed route)
    - Reminder creation as an automatic side effect of Deadline/Task creation, and reminder recomputation/cancellation as a side effect of the relevant update/delete routes — operationalizes SPEC-CORE-003 AC-006/AC-008/AC-009
    - Reminder list/read endpoint, so undelivered reminders stay visible/queryable per NC-006
    - Reminder-acknowledgment endpoint (acknowledge/dismiss/snooze) against SPEC-CORE-003's reminder state machine
    - Voice intake endpoint that creates or continues a SPEC-VOICE-003 session, persisted via SPEC-DATA-004's voice_sessions table
    - Voice confirm/decline endpoints addressed by session id, honoring the session's expires_at confirmation window, so the AwaitingConfirmation round trip resolves against the originally persisted pending_mutation, not a re-parsed one
    - Auth session handling (Supabase Auth sign-in/out, session-refresh callback)
  out_of_scope:
    - Feedback/personalization endpoint (deferred to its own spec update once the underlying schema is added at implementation time)
    - Third-party productivity-tool integrations
    - Any endpoint that produces an autonomous external-world side effect without per-action confirmation
    - Rate limiting implementation details (NC-API-005 states the requirement; the backing store/middleware is an implementation-time decision, not modeled here)
    - An undelete/restore endpoint (soft delete exists for safety, not as a user-facing recovery feature in v1, per SPEC-CORE-003's out_of_scope)
  external_dependencies:
    - Supabase Auth (session/JWT verification)
    - SPEC-VOICE-003 voice_session state machine (orchestrates the voice intake/confirm/decline endpoints)
  shared_schemas:
    - "ApiResponse { success: boolean, data: object|null, error: string|null, meta: { total, page, limit } (paginated endpoints only) }"
    - CoursePayload { code, name, term, meeting_pattern, location, instructor, reminders_enabled, reminder_lead_minutes }
    - DeadlinePayload { course_id, title, due_at, priority }
    - TaskPayload { title, due_at (optional), tags, reminders_enabled, reminder_lead_minutes }
    - NotePayload { body, linked_course_id (optional), linked_task_id (optional), linked_date (optional) }
    - "VoiceConfirmResponse { session_id, executed: boolean, result: object|null }"
state_machines: []
negative_constraints:
  - id: NC-API-001
    message: Every route MUST verify the authenticated Supabase user and scope all reads/writes to that user's own rows — never rely on RLS alone at the API layer.
    severity: critical
  - id: NC-API-002
    message: State fields (deadlines.status, tasks.status, reminders.acknowledgment_state) MUST NOT be settable to an arbitrary value via a generic update; they may only change through an explicit transition action validated against SPEC-CORE-003's deadline_assignment, task_lifecycle, and reminder state machines respectively.
    severity: critical
  - id: NC-API-003
    message: The voice confirm endpoint MUST NOT execute a mutating intent except by resolving the target session's persisted pending_mutation, and only while the session's expires_at has not passed — it must never accept or re-derive a mutation payload from the confirm request itself.
    severity: critical
  - id: NC-API-004
    message: Error responses MUST NOT leak internal details (stack traces, raw database errors) to the client.
    severity: high
  - id: NC-API-005
    message: All state-changing endpoints MUST be rate-limited.
    severity: medium
  - id: NC-API-006
    message: The Course/Deadline/Task/Note delete route MUST perform a soft delete (set deleted_at) and MUST NOT issue a hard DELETE — operationalizes SPEC-DATA-004's NC-DATA-005 at the API layer.
    severity: critical
  - id: NC-API-007
    message: List/get routes MUST NOT return soft-deleted rows unless an explicit include-deleted parameter is set — operationalizes SPEC-DATA-004's NC-DATA-007 at the API layer.
    severity: high
acceptance_criteria:
  - id: AC-1
    given: an authenticated request to create a Deadline or Task with a valid payload
    when: the request is handled
    then: a row is created scoped to that user, a Reminder is automatically scheduled per SPEC-CORE-003 AC-006, and the response follows the ApiResponse success envelope with the created entity
    invariant: true
  - id: AC-2
    given: a request attempting to set a deadline's or task's status directly to an arbitrary value
    when: the value does not correspond to a valid transition event in the entity's governing state machine
    then: the request is rejected with an error envelope, not silently applied
    invariant: true
  - id: AC-3
    given: a voice-intake request whose resolved intent is mutating
    when: the endpoint processes it
    then: it persists the pending_mutation via the voice session and returns an AwaitingConfirmation response naming the session id, rather than performing the mutation
    invariant: true
  - id: AC-4
    given: a request from user A addressing a resource id owned by user B
    when: the route handler runs
    then: it returns not-found/forbidden rather than another user's data, independent of RLS
    invariant: true
  - id: AC-5
    given: a reminder-acknowledgment request targeting a reminder not in the Delivered state
    when: the request is handled
    then: it is rejected as an invalid transition per SPEC-CORE-003's reminder state machine
    invariant: true
  - id: AC-6
    given: a voice confirm request naming a session id in AwaitingConfirmation with expires_at still in the future
    when: the request is handled
    then: the session's persisted pending_mutation is executed exactly as it was when AwaitingConfirmation began, and the session responds with the result
    invariant: true
  - id: AC-7
    given: a DELETE request against a Course, Deadline, Task, or Note owned by the requesting user
    when: the request is handled
    then: the row's deleted_at is set, any Scheduled/Snoozed Reminder targeting a deleted Deadline/Task is dismissed, and the response confirms soft deletion; no SQL DELETE is issued
    invariant: true
  - id: AC-8
    given: an update to a Deadline's due_at, or to the reminder_lead_minutes/reminders_enabled on a Course or Task
    when: the update route processes it successfully
    then: any existing Scheduled Reminder for the affected entity is recomputed or removed to match the new setting, per SPEC-CORE-003 AC-008
    invariant: true
  - id: AC-9
    given: a voice confirm request naming a session id whose expires_at has already passed
    when: the request is handled
    then: it is rejected as expired and no mutation is executed, mirroring SPEC-VOICE-003 AC-7
    invariant: true
depends_on:
  - SPEC-CORE-003
  - SPEC-DATA-004
  - SPEC-VOICE-003
constitution_rules:
  - NC-SQL-CONCAT
