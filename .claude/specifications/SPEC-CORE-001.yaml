# SUPERSEDED by SPEC-CORE-002 (architect-review found this version's Task/Deadline
# reminder model unimplementable — see decision b6131129-9b10-44e6-bf5f-a63279143d25).
# Kept for historical audit-trail purposes only; do not build against this file.
id: SPEC-CORE-001
version: 0.1.0
kind: domain
title: Personal Assistant core domain model
status: deprecated
context_and_scope:
  in_scope:
    - "Class schedule tracking: courses, meeting patterns, locations, instructors"
    - "Assignment/deadline tracking: due dates, status, associated course, priority"
    - Proactive reminder delivery ahead of deadlines, class sessions, and appointments
    - Ad hoc task/to-do management, not necessarily tied to a course
    - Lightweight note-taking, linkable to a course, task, or date
    - Personalization/feedback loop that improves future suggestions and reminder timing from explicit user feedback
    - Single confidential user account, shaped so it does not preclude later multi-account support
  out_of_scope:
    - Multi-user, shared, or household/team accounts
    - Autonomous actions with external side effects (auto-submit, auto-email, auto-register, purchase) without explicit per-action confirmation
    - Deep third-party productivity-tool integrations beyond minimal schedule import
    - Public distribution, multi-tenant operation, billing, or marketplace features
    - Replacing university systems of record (LMS, registrar)
  external_dependencies:
    - Speech-to-text service (vendor undecided)
    - Text-to-speech service (vendor undecided)
    - Push/notification delivery channel (vendor undecided)
    - University academic calendar as an informational reference input
  shared_schemas:
    - Course { code, name, term, meeting_pattern, location, instructor }
    - Deadline { id, course_id, title, due_at, status, priority }
    - Task { id, title, due_at (optional), status, tags }
    - Note { id, body, linked_course_id (optional), linked_task_id (optional), linked_date (optional) }
    - Reminder { id, target_type, target_id, trigger_at, channel, acknowledgment_state }
    - Account { id, email, auth_credential_ref, created_at }
state_machines:
  - name: deadline_assignment
    states:
      - Not Started
      - In Progress
      - Submitted
      - Overdue
      - Completed
      - Cancelled
    initial: Not Started
    transitions:
      - from: Not Started
        event: user_marks_in_progress
        to: In Progress
      - from: In Progress
        event: user_marks_submitted
        to: Submitted
      - from: Not Started
        event: due_date_passed_incomplete
        to: Overdue
      - from: In Progress
        event: due_date_passed_incomplete
        to: Overdue
      - from: Overdue
        event: user_marks_submitted
        to: Submitted
      - from: Submitted
        event: user_confirms_done
        to: Completed
      - from: Not Started
        event: user_cancels
        to: Cancelled
      - from: In Progress
        event: user_cancels
        to: Cancelled
    forbidden:
      - from: Completed
        to: Not Started
        reason: completed work must not silently reopen; a reopen must be its own explicit action, not an automatic transition
      - from: Cancelled
        to: In Progress
        reason: cancelled items are terminal; the user creates a new item rather than resurrecting one
      - from: Overdue
        to: Not Started
        reason: an overdue transition cannot be un-happened; only forward progress (Submitted) or Cancelled is valid from here
  - name: reminder
    states:
      - Scheduled
      - Delivered
      - Acknowledged
      - Dismissed
      - Snoozed
      - Expired
    initial: Scheduled
    transitions:
      - from: Scheduled
        event: trigger_time_reached
        to: Delivered
      - from: Delivered
        event: user_acknowledges
        to: Acknowledged
      - from: Delivered
        event: user_dismisses
        to: Dismissed
      - from: Delivered
        event: user_snoozes
        to: Snoozed
      - from: Snoozed
        event: snooze_time_reached
        to: Delivered
      - from: Delivered
        event: no_response_timeout
        to: Expired
    forbidden:
      - from: Acknowledged
        to: Scheduled
        reason: an acknowledged reminder occurrence is terminal; a new occurrence must be scheduled fresh, not rewound
      - from: Expired
        to: Delivered
        reason: expired reminders must not silently re-fire without a new scheduling decision — protects the reminder-trust success metric
negative_constraints:
  - id: NC-001
    message: Never delete or silently overwrite a user's deadline, task, or note without an explicit, confirmed user action.
    severity: critical
  - id: NC-002
    message: Never take an action with external-world effects (submitting, emailing, registering, purchasing) on the user's behalf without explicit per-action confirmation.
    severity: critical
  - id: NC-003
    message: Never transmit or store voice or text data unencrypted, at rest or in transit.
    severity: critical
  - id: NC-004
    message: Never present an inferred or guessed value (e.g., a class time or deadline) as a confirmed fact; inferred data must be visibly labeled as such.
    severity: high
  - id: NC-005
    message: Never share user data with a third party beyond the minimum required to deliver an explicitly-requested feature (e.g., a chosen speech provider).
    severity: critical
  - id: NC-006
    message: Never let a backlog of undelivered reminders suppress future reminders; undelivered reminders must remain visible and queryable, not silently dropped.
    severity: medium
  - id: NC-007
    message: The personalization/learning loop may only adjust reminder timing, tone, or suggestions — it must never alter core factual data (deadlines, class times) based on inferred behavior.
    severity: high
acceptance_criteria:
  - id: AC-001
    given: a class schedule has been entered for the current term
    when: a class session falls within the configured reminder lead time
    then: a reminder is delivered via the user's chosen channel, and no class-session reminder is ever skipped unless the user has explicitly disabled reminders for that course
    invariant: true
  - id: AC-002
    given: an assignment has a due date
    when: the due date/time passes while status is not Submitted, Completed, or Cancelled
    then: the assignment transitions to Overdue and an overdue notification is generated; an assignment must never remain Not Started or In Progress past its due date without being marked Overdue
    invariant: true
  - id: AC-003
    given: the user issues a spoken command to add a task or deadline
    when: speech-to-text successfully resolves an intent and its entities
    then: the corresponding Task/Deadline is created exactly once and the system confirms back to the user, by voice and/or text, within an agreed latency budget — never zero creations, never duplicates
    invariant: true
  - id: AC-004
    given: the user gives feedback (positive/negative or a correction) on a suggestion or reminder
    when: the feedback is submitted
    then: it is stored and associated with that specific suggestion/reminder instance for future personalization; feedback must never be discarded silently — if it cannot be stored, the user is notified
    invariant: true
  - id: AC-005
    given: the user authenticates from a new or different device
    when: authentication succeeds
    then: the same up-to-date schedule, tasks, deadlines, and notes are visible as on any other authenticated device; no client-local-only store may be the sole source of truth for account data
    invariant: true
depends_on: []
constitution_rules: []
