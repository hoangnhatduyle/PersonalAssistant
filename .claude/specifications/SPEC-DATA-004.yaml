# SUPERSEDED by SPEC-DATA-005 (3rd architect-review pass found the transition-guard
# trigger was UPDATE-only, so an INSERT could set a row directly into a non-initial
# state, bypassing the DB-level backstop for NC-002/NC-VOICE-001 on voice_sessions
# specifically). Kept for historical audit-trail purposes only.
id: SPEC-DATA-004
version: 0.1.0
kind: data
title: Personal Assistant Postgres schema
status: deprecated
context_and_scope:
  in_scope:
    - Postgres schema for courses, deadlines, tasks, notes, reminders, and voice_sessions, plus the profiles table backing SPEC-CORE-003's Account entity
    - Enum types backing the deadline_assignment, task_lifecycle, reminder, and voice_session state machines (the last mirroring SPEC-VOICE-003's public contract)
    - A voice_sessions table backing SPEC-VOICE-003's VoiceSession entity, including a bounded expires_at confirmation window, so the AwaitingConfirmation → Executing round trip can persist across two separate HTTP requests without staying executable indefinitely
    - Row Level Security policies scoping every table to the authenticated user (auth.uid())
    - Soft-delete columns on Courses/Deadlines/Tasks/Notes (SPEC-CORE-003 NC-008) instead of hard DELETE, and a uniform rule that reads exclude soft-deleted rows by default
    - "Reminder lifecycle correctness across entity edits and deletes: recomputing trigger_at on relevant changes, dismissing reminders whose target is soft-deleted, and sweeping stale Delivered reminders to Expired"
    - Timestamp/typing conventions for due dates, reminder trigger/snooze/delivery times
  out_of_scope:
    - Feedback/personalization storage schema (deferred until implementation time, per the recorded retention-policy decision)
    - pg_cron job definition and Edge Function dispatch logic (belongs to the infra spec and the reminder-engine implementation item — this spec defines what the dispatch query must select and update, not how it is scheduled to run)
    - Supabase Auth provider configuration itself (assumed present, not modeled here)
  external_dependencies:
    - Supabase Postgres
    - Supabase Auth auth.users table (referenced by profiles.id)
  shared_schemas:
    - profiles { id uuid PK references auth.users(id), email text, notification_channel text DEFAULT 'in_app_push', created_at timestamptz }
    - courses { id uuid PK, user_id uuid FK profiles(id), code text, name text, term text, meeting_pattern text, location text, instructor text, reminders_enabled boolean DEFAULT true, reminder_lead_minutes int DEFAULT 60, deleted_at timestamptz NULL, created_at timestamptz, updated_at timestamptz }
    - deadlines { id uuid PK, user_id uuid FK profiles(id), course_id uuid FK courses(id) ON DELETE RESTRICT, title text, due_at timestamptz, status deadline_status, priority text, deleted_at timestamptz NULL, created_at timestamptz, updated_at timestamptz }
    - tasks { id uuid PK, user_id uuid FK profiles(id), title text, due_at timestamptz NULL, status task_status, tags text[], reminders_enabled boolean DEFAULT true, reminder_lead_minutes int DEFAULT 60, deleted_at timestamptz NULL, created_at timestamptz, updated_at timestamptz }
    - notes { id uuid PK, user_id uuid FK profiles(id), body text, linked_course_id uuid FK courses(id) ON DELETE SET NULL NULL, linked_task_id uuid FK tasks(id) ON DELETE SET NULL NULL, linked_date date NULL, deleted_at timestamptz NULL, created_at timestamptz }
    - reminders { id uuid PK, user_id uuid FK profiles(id), target_type text CHECK IN ('deadline','task'), target_id uuid, trigger_at timestamptz, snooze_until timestamptz NULL, delivered_at timestamptz NULL, channel text, acknowledgment_state reminder_status, created_at timestamptz }
    - voice_sessions { id uuid PK, user_id uuid FK profiles(id), state voice_session_state, transcript text NULL, resolved_intent text NULL, confidence_score numeric NULL, pending_mutation jsonb NULL, started_at timestamptz, expires_at timestamptz, ended_at timestamptz NULL }
state_machines:
  - name: deadline_status
    states:
      - Not Started
      - In Progress
      - Submitted
      - Overdue
      - Completed
      - Cancelled
    initial: Not Started
    transitions:
      - from: Not Started
        event: user_marks_in_progress
        to: In Progress
      - from: In Progress
        event: user_marks_submitted
        to: Submitted
      - from: Not Started
        event: due_date_passed_incomplete
        to: Overdue
      - from: In Progress
        event: due_date_passed_incomplete
        to: Overdue
      - from: Overdue
        event: user_marks_submitted
        to: Submitted
      - from: Submitted
        event: user_confirms_done
        to: Completed
      - from: Not Started
        event: user_cancels
        to: Cancelled
      - from: In Progress
        event: user_cancels
        to: Cancelled
    forbidden:
      - from: Completed
        to: Not Started
        reason: mirrors SPEC-CORE-003 deadline_assignment
      - from: Cancelled
        to: In Progress
        reason: mirrors SPEC-CORE-003 deadline_assignment
      - from: Overdue
        to: Not Started
        reason: mirrors SPEC-CORE-003 deadline_assignment
  - name: task_status
    states:
      - Open
      - Done
      - Cancelled
    initial: Open
    transitions:
      - from: Open
        event: user_marks_done
        to: Done
      - from: Open
        event: user_cancels
        to: Cancelled
    forbidden:
      - from: Done
        to: Open
        reason: mirrors SPEC-CORE-003 task_lifecycle
      - from: Cancelled
        to: Open
        reason: mirrors SPEC-CORE-003 task_lifecycle
  - name: reminder_status
    states:
      - Scheduled
      - Delivered
      - Acknowledged
      - Dismissed
      - Snoozed
      - Expired
    initial: Scheduled
    transitions:
      - from: Scheduled
        event: trigger_time_reached
        to: Delivered
      - from: Delivered
        event: user_acknowledges
        to: Acknowledged
      - from: Delivered
        event: user_dismisses
        to: Dismissed
      - from: Delivered
        event: user_snoozes
        to: Snoozed
      - from: Snoozed
        event: snooze_time_reached
        to: Delivered
      - from: Delivered
        event: no_response_timeout
        to: Expired
      - from: Scheduled
        event: target_soft_deleted
        to: Dismissed
      - from: Snoozed
        event: target_soft_deleted
        to: Dismissed
    forbidden:
      - from: Acknowledged
        to: Scheduled
        reason: mirrors SPEC-CORE-003 reminder
      - from: Expired
        to: Delivered
        reason: mirrors SPEC-CORE-003 reminder
  - name: voice_session_state
    states:
      - Idle
      - Listening
      - Transcribing
      - IntentResolved
      - IntentAmbiguous
      - AwaitingConfirmation
      - Executing
      - Responding
    initial: Idle
    transitions:
      - from: Idle
        event: user_initiates_capture
        to: Listening
      - from: Listening
        event: capture_ends
        to: Transcribing
      - from: Transcribing
        event: intent_resolved_high_confidence
        to: IntentResolved
      - from: Transcribing
        event: intent_ambiguous_or_low_confidence
        to: IntentAmbiguous
      - from: IntentAmbiguous
        event: clarification_requested
        to: Responding
      - from: IntentResolved
        event: read_only_query_resolved
        to: Executing
      - from: IntentResolved
        event: mutating_action_resolved
        to: AwaitingConfirmation
      - from: AwaitingConfirmation
        event: user_confirms
        to: Executing
      - from: AwaitingConfirmation
        event: user_declines
        to: Responding
      - from: AwaitingConfirmation
        event: confirmation_window_expired
        to: Responding
      - from: Executing
        event: execution_completed
        to: Responding
      - from: Executing
        event: execution_failed
        to: Responding
      - from: Responding
        event: response_delivered
        to: Idle
    forbidden:
      - from: Executing
        to: Idle
        reason: "mirrors SPEC-VOICE-003 voice_session: execution must always pass through Responding"
      - from: Transcribing
        to: Executing
        reason: "mirrors SPEC-VOICE-003 voice_session: no intent may execute before resolution/confirmation"
      - from: Idle
        to: Executing
        reason: "mirrors SPEC-VOICE-003 voice_session: nothing executes outside an active session"
negative_constraints:
  - id: NC-DATA-001
    message: Every table holding user data MUST have a user_id column enforced via Row Level Security restricting rows to auth.uid() = user_id; no such table may be queried with RLS disabled.
    severity: critical
  - id: NC-DATA-002
    message: Status/state columns (deadlines.status, tasks.status, reminders.acknowledgment_state, voice_sessions.state) MUST use the Postgres enum types defined in this spec, never free-text, so invalid states are rejected at the schema level.
    severity: high
  - id: NC-DATA-003
    message: The forbidden transitions declared in SPEC-CORE-003's deadline_assignment, task_lifecycle, and reminder state machines, and in SPEC-VOICE-003's voice_session machine, MUST be enforced by a transition-guard trigger on UPDATE, not left to application code alone.
    severity: high
  - id: NC-DATA-004
    message: All due-date, trigger, snooze, delivery, and session expiry timestamp columns MUST use timestamptz, never text or naive timestamp, since reminder and confirmation-window scheduling correctness depends on unambiguous timezone handling.
    severity: high
  - id: NC-DATA-005
    message: Courses, Deadlines, Tasks, and Notes rows MUST be soft-deleted (deleted_at set) rather than removed via SQL DELETE; application code MUST NOT issue a hard DELETE against these tables. Operationalizes SPEC-CORE-003's NC-008.
    severity: critical
  - id: NC-DATA-006
    message: notes.linked_course_id and notes.linked_task_id MUST use ON DELETE SET NULL, so soft-deleting or removing a linked Course/Task never cascade-deletes an unrelated Note.
    severity: high
  - id: NC-DATA-007
    message: List/get queries against courses, deadlines, tasks, and notes MUST filter deleted_at IS NULL by default; a soft-deleted row must not appear in ordinary reads. Operationalizes SPEC-CORE-003 AC-010.
    severity: high
  - id: NC-DATA-008
    message: The reminder-dispatch query MUST exclude any reminder whose target Deadline or Task has deleted_at set, as a backstop to the target_soft_deleted cascade. Operationalizes SPEC-CORE-003's NC-009.
    severity: critical
acceptance_criteria:
  - id: AC-1
    given: a deadline, task, or voice_session row in a non-terminal state
    when: an UPDATE attempts a forbidden transition (e.g. deadline Completed to Not Started, task Done to Open, or voice_session Executing to Idle)
    then: the transaction is rejected by the database trigger, not merely by application-layer logic
    invariant: true
  - id: AC-2
    given: two different authenticated users, each with their own rows across courses/deadlines/tasks/notes/reminders/voice_sessions
    when: user A queries any of these tables
    then: no row belonging to user B is ever returned, enforced by RLS rather than by query-time filtering alone
    invariant: true
  - id: AC-3
    given: a reminder row that is either (a) acknowledgment_state Scheduled with trigger_at in the past, or (b) acknowledgment_state Snoozed with snooze_until in the past, and whose target Deadline/Task is not soft-deleted
    when: the reminder-dispatch query runs
    then: the row is selected for delivery, its acknowledgment_state transitions to Delivered, and delivered_at is set to the current time
    invariant: true
  - id: AC-4
    given: a voice_sessions row in state AwaitingConfirmation with a pending_mutation payload and an expires_at in the future, created by one HTTP request
    when: a subsequent, separate HTTP request reads that row by its id before expires_at
    then: the same pending_mutation payload is available to execute or discard — confirmation state survives across stateless request boundaries
    invariant: true
  - id: AC-5
    given: a user requests deletion of a course, deadline, task, or note
    when: the deletion is processed
    then: the row's deleted_at is set and the row remains queryable only via an explicit include-deleted query; it is never removed from the table
    invariant: true
  - id: AC-6
    given: an ordinary (non-include-deleted) list or get query against courses, deadlines, tasks, or notes
    when: the query executes
    then: no row with deleted_at set is returned
    invariant: true
  - id: AC-7
    given: a Scheduled or Snoozed reminder whose target Deadline or Task is soft-deleted
    when: the target's deleted_at is set
    then: the reminder transitions to Dismissed in the same operation, and the dispatch query's deleted_at IS NULL filter independently ensures it is never delivered even if the cascade were missed
    invariant: true
  - id: AC-8
    given: a Delivered reminder with delivered_at more than 60 minutes in the past and acknowledgment_state still Delivered
    when: the dispatch sweep runs
    then: it transitions to Expired
    invariant: true
depends_on:
  - SPEC-CORE-003
constitution_rules:
  - NC-SQL-CONCAT
