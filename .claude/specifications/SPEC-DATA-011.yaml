id: SPEC-DATA-011
version: 0.3.0
kind: data
title: Knowledge Reference Postgres schema
status: draft
context_and_scope:
  in_scope:
    - knowledge_sources and knowledge_chunks tables, RLS, grants, and indexes
    - pgvector extension enablement (in the extensions schema, matching this project's existing convention)
    - A DB trigger enforcing SPEC-CORE-008's knowledge_import_status state machine across status AND error_message
    - "start_knowledge_import(): a SECURITY DEFINER RPC performing the Pending→Processing transition (processing_started event) and stamping processing_started_at = now(); callable only by service_role. This is the fourth and final named writer of status — every transition in SPEC-CORE-008's state machine has exactly one owning function (this one, complete_knowledge_import, fail_knowledge_import, retry_knowledge_import, or reap_stuck_knowledge_imports), none is left as an unnamed 'the worker's own call'."
    - "complete_knowledge_import(): a single atomic completion RPC accepting the fetched/pasted raw_content and the full chunk set together, replacing any prior chunk set, writing raw_content, and flipping status to Ready in one transaction (satisfies SPEC-CORE-008's NC-020 all-or-nothing requirement — content and chunks become visible atomically, never partially); callable only by service_role"
    - "fail_knowledge_import(): a SECURITY DEFINER RPC performing the Processing→Failed transition (extraction_failed event), recording the caller-supplied error_message; callable only by service_role"
    - "retry_knowledge_import(): a SECURITY DEFINER RPC enforcing ownership, Failed-state, and the attempt cap for user-initiated retry (the user_retries event), re-stamping processing_started_at = now() so the reaper's window restarts cleanly rather than reaping a freshly-retried row on the very next tick; callable by authenticated"
    - "reap_stuck_knowledge_imports(): a pure-SQL SECURITY DEFINER function transitioning stranded Pending/Processing rows to Failed past a timeout window strictly longer than SPEC-INFRA-007's maxDuration (see NC-DATA-027); callable only by the cron-invoking role (mirrors dispatch_due_reminders)"
    - Hard delete of a knowledge_source (RLS-scoped DELETE by the owning user) with automatic chunk removal via FK ON DELETE CASCADE — no separate purge RPC needed
  out_of_scope:
    - The out-of-process ingestion worker's own process/media-parsing sandboxing (untrusted OCR/transcription input handling) — owned by SPEC-INFRA-007
    - Where uploaded file bytes are stored (Storage bucket, RLS on it) — owned by SPEC-INFRA-007
    - The /api/knowledge route contracts and request/response shapes — owned by SPEC-API-008
    - Scheduling/cadence for the reap_stuck_knowledge_imports cron job (the function exists here; its cron.schedule entry is owned by SPEC-INFRA-007, mirroring how SPEC-DATA-010 owns dispatch_due_reminders' body while SPEC-INFRA-006 owns its schedule)
  external_dependencies: []
  shared_schemas:
    - "knowledge_sources { id uuid PK DEFAULT gen_random_uuid(), user_id uuid NOT NULL FK profiles(id) ON DELETE CASCADE, source_type knowledge_source_type NOT NULL (enum: url | pasted_text | image | video | audio), title text NOT NULL, origin_url text NULL, raw_content text NULL (the extracted/pasted text content once Ready — for pasted_text this is the user's input verbatim; for url/image/video/audio it is the fetched page text, OCR output, or transcript, retained so a future retry after a downstream failure — e.g. embedding call failing after extraction succeeded — doesn't have to re-fetch/re-OCR/re-transcribe; this is intentional duplication against chunk_text, not an oversight), storage_object_path text NULL (set only for image/video/audio uploads; points into the Storage bucket owned by SPEC-INFRA-007), status knowledge_source_status NOT NULL DEFAULT 'Pending', error_message text NULL, attempt_count int NOT NULL DEFAULT 0, processing_started_at timestamptz NULL (the reaper's timeout predicate; distinct from updated_at, which any column write touches), created_at timestamptz NOT NULL DEFAULT now(), updated_at timestamptz NOT NULL DEFAULT now(), UNIQUE (id, user_id) }"
    - "knowledge_chunks { id uuid PK DEFAULT gen_random_uuid(), source_id uuid NOT NULL, user_id uuid NOT NULL, chunk_index int NOT NULL, chunk_text text NOT NULL, embedding vector(1536) NOT NULL, created_at timestamptz NOT NULL DEFAULT now(), FOREIGN KEY (source_id, user_id) REFERENCES knowledge_sources (id, user_id) ON DELETE CASCADE, UNIQUE (source_id, chunk_index) }"
state_machines:
  - name: knowledge_source_status
    states:
      - Pending
      - Processing
      - Ready
      - Failed
    initial: Pending
    transitions:
      - from: Pending
        event: processing_started
        to: Processing
      - from: Processing
        event: extraction_succeeded
        to: Ready
      - from: Processing
        event: extraction_failed
        to: Failed
      - from: Processing
        event: processing_timed_out
        to: Failed
      - from: Pending
        event: processing_timed_out
        to: Failed
      - from: Failed
        event: user_retries
        to: Processing
    forbidden:
      - from: Ready
        to: Pending
        reason: A completed import must not silently reset.
      - from: Ready
        to: Processing
        reason: No content-refresh feature in v1; Ready is terminal aside from delete.
      - from: Ready
        to: Failed
        reason: A completed import cannot retroactively fail.
      - from: Failed
        to: Ready
        reason: Must pass back through Processing on retry.
      - from: Pending
        to: Ready
        reason: Cannot skip Processing.
negative_constraints:
  - id: NC-DATA-014
    message: "RLS on auth.uid() = user_id applies to both tables. knowledge_chunks.user_id is not a bare duplicated column but is structurally tied to its parent via a composite foreign key — FOREIGN KEY (source_id, user_id) REFERENCES knowledge_sources (id, user_id), backed by a UNIQUE (id, user_id) constraint on knowledge_sources — so a chunk's user_id can never drift from its source's, enforced declaratively rather than by trigger or app-layer discipline."
    severity: critical
  - id: NC-DATA-015
    message: knowledge_sources.status must use the knowledge_source_status Postgres enum, never free text (mirrors NC-DATA-002).
    severity: medium
  - id: NC-DATA-016
    message: A BEFORE INSERT OR UPDATE OF status, error_message trigger enforces initial status = Pending on insert and only the transitions allowed by SPEC-CORE-008's knowledge_import_status state machine on update. The trigger must fire on error_message changes too, not status alone — a column-list trigger scoped to status only would let an UPDATE that never touches status silently rewrite error_message, exactly the gap SPEC-DATA-010's voice_sessions column-lockdown migration (0005) had to close after the fact for pending_mutation/expires_at. This trigger is defense-in-depth for the RPC bodies' own correctness; the primary defense is NC-DATA-025's removal of the UPDATE grant, which stops an authenticated client from reaching an UPDATE on this table at all — PostgREST checks the table-level grant before RLS or any trigger is even consulted.
    severity: critical
  - id: NC-DATA-017
    message: All timing columns (created_at, updated_at, processing_started_at) are timestamptz (mirrors NC-DATA-004).
    severity: medium
  - id: NC-DATA-018
    message: knowledge_sources uses hard delete, not the soft-delete mechanism used by Course/Deadline/Task/Note. This is a deliberate departure from NC-DATA-005/NC-008 (see SPEC-CORE-008 NC-026 for the full justification) — chunk content is unconditionally purged on delete regardless, so a tombstoned source row offers no real recoverability, and imported reference material is closer to voice_sessions/feedback (bounded, non-authored, hard-deleted data) than to the four core authored entities NC-DATA-005 governs.
    severity: medium
  - id: NC-DATA-019
    message: Deleting a knowledge_source is a single RLS-scoped DELETE by its owner; its knowledge_chunks are removed automatically via the composite FK's ON DELETE CASCADE (NC-DATA-014) in the same statement. No separate purge step or RPC is required — chunk removal is inherent to the FK relationship, not a cascade to orchestrate.
    severity: critical
  - id: NC-DATA-020
    message: knowledge_chunks.embedding is vector(1536) NOT NULL (OpenAI text-embedding-3-small dimensionality) — a chunk row must never exist without a populated embedding. An HNSW index with vector_cosine_ops backs similarity search; any retrieval query must use the <=> cosine-distance operator to actually hit this index (a query using <-> silently defeats it).
    severity: medium
  - id: NC-DATA-021
    message: The pgvector extension is enabled via CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA extensions (not the public schema), matching this project's existing convention for pgcrypto and its extra_search_path config. It must be enabled before either table is created.
    severity: high
  - id: NC-DATA-022
    message: "RETIRED — this id previously specified soft-delete-only default query filtering (deleted_at IS NULL); it no longer applies now that NC-DATA-018 switched knowledge_sources to hard delete. Left as an explicit tombstone rather than silently reused, since SPEC-CORE-008 and other specs may cite negative-constraint ids by number."
    severity: low
  - id: NC-DATA-023
    message: Chunk writes (insert of a new chunk set, the raw_content write, and the accompanying status flip to Ready) happen only through complete_knowledge_import(), a single SECURITY DEFINER transaction that deletes any pre-existing chunks for the source before inserting the new set — never as separate worker-issued statements — because supabase-js has no cross-call transaction primitive (the same fact this project's own soft-delete-cascade migration comments already document), so NC-020's all-or-nothing guarantee is unenforceable any other way. Its own UPDATE of knowledge_sources is CAS-guarded (WHERE id = p_source_id AND status = 'Processing'), so it cannot succeed against a row the reaper has already timed out from under it — this closes the three-way race between complete_knowledge_import, reap_stuck_knowledge_imports, and retry_knowledge_import, none of which may silently overwrite a transition another of them already made. EXECUTE on this function is revoked from public/anon/authenticated and granted only to service_role.
    severity: critical
  - id: NC-DATA-030
    message: start_knowledge_import() and fail_knowledge_import() are each a single CAS-guarded UPDATE — start_knowledge_import's WHERE clause requires status = 'Pending' (rejecting a stale/duplicate worker invocation), fail_knowledge_import's requires status = 'Processing' (an extraction failure can only be recorded against a row still being processed, never a Ready or already-Failed one) — for the same race-protection reason as NC-DATA-023. Both are revoked from public/anon/authenticated and granted only to service_role.
    severity: high
  - id: NC-DATA-024
    message: knowledge_chunks grants no INSERT/UPDATE/DELETE to authenticated or anon (SELECT-only, mirroring feedback_aggregates' lockdown in SPEC-DATA-010) — the only writer is complete_knowledge_import() and the cascade delete in NC-DATA-019. This prevents a user from hand-crafting a fake embedding or rewriting chunk_text so the assistant would cite a source for content that source never actually contained.
    severity: critical
  - id: NC-DATA-025
    message: knowledge_sources grants SELECT, INSERT, and DELETE to authenticated (all auth.uid() = user_id scoped) but no UPDATE policy at all. Every status-touching write is owned by exactly one of the five named functions in this spec's in_scope (start_knowledge_import, complete_knowledge_import, fail_knowledge_import, retry_knowledge_import, reap_stuck_knowledge_imports) — never a generic client-issued UPDATE. This closes NC-019/NC-DATA-016's intent structurally rather than relying on the API surface simply not exposing a PATCH route.
    severity: critical
  - id: NC-DATA-026
    message: retry_knowledge_import() is SECURITY DEFINER and performs its transition as a single CAS-guarded statement — UPDATE knowledge_sources SET status = 'Processing', attempt_count = attempt_count + 1, processing_started_at = now(), error_message = NULL WHERE id = p_source_id AND user_id = auth.uid() AND status = 'Failed' AND attempt_count < KNOWLEDGE_MAX_RETRY_ATTEMPTS — not a SELECT-then-conditional-UPDATE, which would reopen the exact double-retry/reaper race this pattern exists to close. Zero rows affected means the request is rejected (already retried, wrong owner, or cap exhausted), not silently treated as success. Granted EXECUTE only to authenticated (auth.uid() inside a SECURITY DEFINER function still resolves from the caller's JWT, not the function owner, so per-caller ownership checking works correctly here).
    severity: high
  - id: NC-DATA-027
    message: reap_stuck_knowledge_imports() is pure SQL with no external HTTP/API call, invoked directly and synchronously from cron.schedule (mirrors dispatch_due_reminders/sweep_expired_feedback in SPEC-DATA-010 and preserves SPEC-INFRA-006's existing job_run_details-truthfulness rule) — it transitions Pending or Processing rows whose processing_started_at (or created_at, for rows that never left Pending) is older than KNOWLEDGE_IMPORT_TIMEOUT_MINUTES = 10 to Failed via processing_timed_out, with a generic timeout error_message. This window MUST be strictly longer than SPEC-INFRA-007's maxDuration (5 minutes) — if the reaper's window were shorter than or equal to maxDuration, it could time out and mark Failed a row that is still legitimately being processed within its own allowed duration, causing complete_knowledge_import's later CAS-guarded write (NC-DATA-023) to simply lose the race silently rather than the work being duplicated. EXECUTE is revoked from public/anon/authenticated and granted only to the cron-invoking role.
    severity: high
  - id: NC-DATA-028
    message: "source_type is a Postgres enum (url | pasted_text | image | video | audio), never free text, mirroring NC-DATA-002's rule for status columns."
    severity: medium
  - id: NC-DATA-029
    message: "Beyond the HNSW index on embedding, the migration must include: an index on knowledge_sources(user_id) and knowledge_chunks(user_id) for RLS-scoped scans (mirroring courses_user_id_idx etc. in the existing migrations); an index on knowledge_chunks(source_id) required both by RLS-scoped reads and by the FK cascade delete; and a partial index on knowledge_sources(created_at) WHERE status IN ('Pending','Processing') to back reap_stuck_knowledge_imports' predicate, the same pattern voice_sessions_retention_idx already uses for its sweep."
    severity: medium
acceptance_criteria:
  - id: AC-001
    given: the migration has run
    then: the pgvector extension is enabled and knowledge_sources/knowledge_chunks exist with RLS enabled on both
    invariant: false
  - id: AC-002
    when: a user queries either table
    then: RLS prevents any row belonging to a different user_id from being returned, independent of any app-layer check
    invariant: true
  - id: AC-003
    when: an INSERT into knowledge_sources specifies any status other than Pending
    then: the enforcement trigger rejects it
    invariant: true
  - id: AC-003b
    when: an authenticated user attempts any UPDATE on knowledge_sources (including one that only touches error_message, not status)
    then: it is rejected — there is no UPDATE grant for authenticated, and status-touching writes are only reachable through the five named functions (start_knowledge_import, complete_knowledge_import, fail_knowledge_import, retry_knowledge_import, reap_stuck_knowledge_imports)
    invariant: true
  - id: AC-003c
    when: an authenticated user attempts any INSERT/UPDATE/DELETE on knowledge_chunks directly (not via complete_knowledge_import or the source-cascade delete)
    then: it is rejected — knowledge_chunks is SELECT-only for authenticated
    invariant: true
  - id: AC-004
    given: a knowledge_source is deleted
    then: its knowledge_chunks are removed in the same statement via ON DELETE CASCADE, zero remaining
    invariant: false
  - id: AC-004b
    given: a chunk insert attempt for a source_id/user_id pair that doesn't match an existing knowledge_sources row exactly
    then: the composite foreign key rejects it
    invariant: true
  - id: AC-005
    given: a similarity search query against knowledge_chunks.embedding using the <=> operator
    then: it is plan-eligible for the HNSW index (verified via EXPLAIN with enable_seqscan off in tests, since planner choice at small row counts is not itself a reliable signal)
    invariant: false
  - id: AC-006
    given: a knowledge_source stuck in Pending or Processing past the timeout window
    when: reap_stuck_knowledge_imports() runs
    then: it transitions to Failed with a timeout error_message, and no external HTTP/API call occurs during the sweep
    invariant: false
  - id: AC-007
    given: knowledge_chunks has no DELETE grant/policy for authenticated (NC-DATA-024)
    when: an authenticated user deletes their own knowledge_sources row
    then: the FK's ON DELETE CASCADE still removes all of that source's knowledge_chunks rows — Postgres FK referential-integrity actions execute independent of the referencing table's own grants/RLS for the deleting role, and this must be verified with an explicit test rather than assumed
    invariant: true
  - id: AC-008
    given: complete_knowledge_import, start_knowledge_import, or fail_knowledge_import is invoked against a row whose status no longer matches that function's required CAS precondition (e.g. the reaper already moved it to Failed)
    then: the function's guarded UPDATE affects zero rows and the caller observes a normal not-applicable outcome, never overwriting a transition another writer already made
    invariant: true
depends_on:
  - SPEC-CORE-008
  - SPEC-DATA-010
constitution_rules: []
