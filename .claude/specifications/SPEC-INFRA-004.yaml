# SUPERSEDED by SPEC-INFRA-005 (Item 6: gives the new feedback
# retention-sweep job an explicit scheduling owner — in-process
# cron.schedule invocation, same shape as the reminder-dispatch and
# voice_sessions sweep jobs — instead of leaving it unbound while
# SPEC-DATA-008/009 required atomicity an HTTP hop would have broken).
# Kept for historical audit-trail purposes only.
id: SPEC-INFRA-004
version: 0.1.0
kind: infra
title: Deploy target and runtime contract
status: deprecated
context_and_scope:
  in_scope:
    - Vercel deploy target for the Next.js app
    - Environment variable contract, explicit about which values are browser-safe (NEXT_PUBLIC_-prefixed) versus server-only
    - A startup environment validator that fails fast when a required variable is missing, rather than starting in a broken state
    - A health-check endpoint that the rollout state machine's promotion step actually calls before allowing STAGED -> LIVE
    - "pg_cron reminder-dispatch job definition and its runtime lifecycle (required because Vercel Hobby Cron cannot run more than once/day, per the recorded stack decision): pg_cron invokes SPEC-DATA-006's dispatch_due_reminders() RPC directly and synchronously within the scheduled job's own transaction, so pg_cron's native job-run status (starting/running/succeeded/failed) is a truthful, queryable record of the dispatch outcome"
  out_of_scope:
    - CI pipeline definition
    - The dispatch_due_reminders() RPC's own dispatch-query internals (owned by SPEC-DATA-006) -- this spec only defines how and how often it is invoked
    - "An HTTP hop through a Supabase Edge Function for the dispatch trigger -- rejected during this spec's own architect-review round: net.http_post()/pg_net enqueues a request and returns immediately, so a downstream failure (function error, auth rejection, timeout) would never surface as a Failed job run, making the reminder_cron_job Failed state permanently unreachable and observably violating this spec's own Failed->Succeeded forbidden transition. Revisit only once a real external notification channel (push/email vendor still undecided per SPEC-CORE-005) actually needs a non-Postgres runtime to call out to; v1 delivery is the DB state change alone, polled by GET /api/reminders"
  external_dependencies:
    - Vercel
    - Supabase (Postgres, pg_cron)
  shared_schemas:
    - ENV { NEXT_PUBLIC_SUPABASE_URL (browser-safe), NEXT_PUBLIC_SUPABASE_ANON_KEY (browser-safe), SUPABASE_SERVICE_ROLE_KEY (server-only, never NEXT_PUBLIC_-prefixed), DEEPGRAM_API_KEY (server-only), ELEVENLABS_API_KEY (server-only), OPENAI_API_KEY (server-only) }
state_machines:
  - name: rollout
    states:
      - BUILDING
      - STAGED
      - LIVE
      - ROLLED_BACK
    initial: BUILDING
    transitions:
      - from: BUILDING
        event: stage
        to: STAGED
      - from: STAGED
        event: promote
        to: LIVE
      - from: LIVE
        event: rollback
        to: ROLLED_BACK
    forbidden:
      - from: BUILDING
        to: LIVE
        reason: must pass through STAGED and a passing health check before receiving live traffic
  - name: reminder_cron_job
    states:
      - Scheduled
      - Running
      - Succeeded
      - Failed
    initial: Scheduled
    transitions:
      - from: Scheduled
        event: tick
        to: Running
      - from: Running
        event: dispatch_completed
        to: Succeeded
      - from: Running
        event: dispatch_errored
        to: Failed
      - from: Failed
        event: retry_next_tick
        to: Scheduled
      - from: Succeeded
        event: next_tick
        to: Scheduled
    forbidden:
      - from: Failed
        to: Succeeded
        reason: a failed dispatch run must not be silently marked successful; it must actually complete a dispatch pass first -- protects SPEC-CORE-005's NC-006. Directly maps to pg_cron's own job_run_details.status, which is why the dispatch call must be synchronous/in-process rather than an async HTTP enqueue
negative_constraints:
  - id: NC-INF-001
    message: Secrets (Supabase service role key, Deepgram/ElevenLabs/OpenAI API keys) MUST NOT be committed to the repo or baked into any build artifact; inject at runtime via Vercel/Supabase environment configuration only.
    severity: critical
  - id: NC-INF-002
    message: The reminder-dispatch job MUST NOT be promoted to LIVE without a passing health check confirming it can reach Postgres and the notification channel.
    severity: high
  - id: NC-INF-003
    message: A Failed reminder-dispatch run MUST NOT be silently marked Succeeded; it must retry on the next scheduled tick and remain visible/queryable while failing.
    severity: high
  - id: NC-INF-004
    message: The service MUST NOT serve LIVE production traffic without TLS termination.
    severity: critical
  - id: NC-INF-005
    message: "SUPABASE_SERVICE_ROLE_KEY usage MUST be confined to server-only route handlers; it MUST NEVER be imported into client-bundled code or given a NEXT_PUBLIC_ prefix -- doing so would bypass RLS (NC-DATA-001) for every browser session. The reminder-dispatch job itself needs no service-role key at all: it runs dispatch_due_reminders() in-process as the migration-owning role, never over HTTP."
    severity: critical
acceptance_criteria:
  - id: AC-1
    given: a freshly built deployment
    when: promotion to LIVE is attempted directly from BUILDING
    then: it is blocked (forbidden BUILDING->LIVE)
    invariant: true
  - id: AC-2
    given: the reminder-dispatch cron job, whose scheduled command directly invokes SPEC-DATA-006's dispatch_due_reminders() RPC in-process
    when: a tick fires and the RPC call succeeds
    then: the job transitions Running to Succeeded (reflected truthfully in pg_cron's own job_run_details), due Scheduled/Snoozed reminders are moved to Delivered, and stale Delivered reminders past the 60-minute window are swept to Expired in the same pass, per SPEC-CORE-005 AC-011 / SPEC-DATA-006 AC-8
    invariant: true
  - id: AC-3
    given: the reminder-dispatch cron job
    when: a tick fires and the RPC call errors
    then: the job transitions Running to Failed -- visible and queryable directly in pg_cron's job_run_details, not merely in an application log -- and the next scheduled tick still fires
    invariant: true
  - id: AC-4
    given: the app booting with a required env var missing from the ENV contract
    when: startup runs
    then: it fails fast with a clear error rather than starting in a broken state
    invariant: true
  - id: AC-5
    given: a build artifact or client-side bundle
    when: it is inspected for embedded secrets
    then: SUPABASE_SERVICE_ROLE_KEY and the voice-vendor API keys are absent -- only the two NEXT_PUBLIC_ values may appear client-side
    invariant: true
depends_on:
  - SPEC-DATA-006
  - SPEC-CORE-005
constitution_rules:
  - NC-SECRETS
