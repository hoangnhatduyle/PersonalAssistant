spec_id: SPEC-API-003
generated_at: 2026-08-27T13:22:14.180Z
cases:
  - id: T-SPEC-API-003-AC-AC_1
    kind: acceptance
    traces_to: SPEC-API-003#AC-1
    assertion: given an authenticated request to create a Deadline or Task with a valid payload, when the request is handled, then a row is created scoped to that user, a Reminder is automatically scheduled per SPEC-CORE-003 AC-006, and the response follows the ApiResponse success envelope with the created entity
    invariant: true
  - id: T-SPEC-API-003-AC-AC_2
    kind: acceptance
    traces_to: SPEC-API-003#AC-2
    assertion: given a request attempting to set a deadline's or task's status directly to an arbitrary value, when the value does not correspond to a valid transition event in the entity's governing state machine, then the request is rejected with an error envelope, not silently applied
    invariant: true
  - id: T-SPEC-API-003-AC-AC_3
    kind: acceptance
    traces_to: SPEC-API-003#AC-3
    assertion: given a voice-intake request whose resolved intent is mutating, when the endpoint processes it, then it persists the pending_mutation via the voice session and returns an AwaitingConfirmation response naming the session id, rather than performing the mutation
    invariant: true
  - id: T-SPEC-API-003-AC-AC_4
    kind: acceptance
    traces_to: SPEC-API-003#AC-4
    assertion: given a request from user A addressing a resource id owned by user B, when the route handler runs, then it returns not-found/forbidden rather than another user's data, independent of RLS
    invariant: true
  - id: T-SPEC-API-003-AC-AC_5
    kind: acceptance
    traces_to: SPEC-API-003#AC-5
    assertion: given a reminder-acknowledgment request targeting a reminder not in the Delivered state, when the request is handled, then it is rejected as an invalid transition per SPEC-CORE-003's reminder state machine
    invariant: true
  - id: T-SPEC-API-003-AC-AC_6
    kind: acceptance
    traces_to: SPEC-API-003#AC-6
    assertion: given a voice confirm request naming a session id in AwaitingConfirmation with expires_at still in the future, when the request is handled, then the session's persisted pending_mutation is executed exactly as it was when AwaitingConfirmation began, and the session responds with the result
    invariant: true
  - id: T-SPEC-API-003-AC-AC_7
    kind: acceptance
    traces_to: SPEC-API-003#AC-7
    assertion: given a DELETE request against a Course, Deadline, Task, or Note owned by the requesting user, when the request is handled, then the row's deleted_at is set, any Scheduled/Snoozed Reminder targeting a deleted Deadline/Task is dismissed, and the response confirms soft deletion; no SQL DELETE is issued
    invariant: true
  - id: T-SPEC-API-003-AC-AC_8
    kind: acceptance
    traces_to: SPEC-API-003#AC-8
    assertion: given an update to a Deadline's due_at, or to the reminder_lead_minutes/reminders_enabled on a Course or Task, when the update route processes it successfully, then any existing Scheduled Reminder for the affected entity is recomputed or removed to match the new setting, per SPEC-CORE-003 AC-008
    invariant: true
  - id: T-SPEC-API-003-AC-AC_9
    kind: acceptance
    traces_to: SPEC-API-003#AC-9
    assertion: given a voice confirm request naming a session id whose expires_at has already passed, when the request is handled, then it is rejected as expired and no mutation is executed, mirroring SPEC-VOICE-003 AC-7
    invariant: true
  - id: T-SPEC-API-003-NC-NC_API_001
    kind: negative-constraint
    traces_to: SPEC-API-003#NC-API-001
    assertion: Every route MUST verify the authenticated Supabase user and scope all reads/writes to that user's own rows — never rely on RLS alone at the API layer.
    invariant: true
  - id: T-SPEC-API-003-NC-NC_API_002
    kind: negative-constraint
    traces_to: SPEC-API-003#NC-API-002
    assertion: State fields (deadlines.status, tasks.status, reminders.acknowledgment_state) MUST NOT be settable to an arbitrary value via a generic update; they may only change through an explicit transition action validated against SPEC-CORE-003's deadline_assignment, task_lifecycle, and reminder state machines respectively.
    invariant: true
  - id: T-SPEC-API-003-NC-NC_API_003
    kind: negative-constraint
    traces_to: SPEC-API-003#NC-API-003
    assertion: The voice confirm endpoint MUST NOT execute a mutating intent except by resolving the target session's persisted pending_mutation, and only while the session's expires_at has not passed — it must never accept or re-derive a mutation payload from the confirm request itself.
    invariant: true
  - id: T-SPEC-API-003-NC-NC_API_004
    kind: negative-constraint
    traces_to: SPEC-API-003#NC-API-004
    assertion: Error responses MUST NOT leak internal details (stack traces, raw database errors) to the client.
    invariant: true
  - id: T-SPEC-API-003-NC-NC_API_006
    kind: negative-constraint
    traces_to: SPEC-API-003#NC-API-006
    assertion: The Course/Deadline/Task/Note delete route MUST perform a soft delete (set deleted_at) and MUST NOT issue a hard DELETE — operationalizes SPEC-DATA-004's NC-DATA-005 at the API layer.
    invariant: true
  - id: T-SPEC-API-003-NC-NC_API_007
    kind: negative-constraint
    traces_to: SPEC-API-003#NC-API-007
    assertion: List/get routes MUST NOT return soft-deleted rows unless an explicit include-deleted parameter is set — operationalizes SPEC-DATA-004's NC-DATA-007 at the API layer.
    invariant: true
