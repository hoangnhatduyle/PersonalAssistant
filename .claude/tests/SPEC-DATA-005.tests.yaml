  - id: T-SPEC-DATA-005-NC-NC_DATA_001
    kind: negative-constraint
    traces_to: SPEC-DATA-005#NC-DATA-001
    assertion: Every table holding user data MUST have a user_id column enforced via Row Level Security restricting rows to auth.uid() = user_id; no such table may be queried with RLS disabled.
    invariant: true
  - id: T-SPEC-DATA-005-NC-NC_DATA_002
    kind: negative-constraint
    traces_to: SPEC-DATA-005#NC-DATA-002
    assertion: Status/state columns (deadlines.status, tasks.status, reminders.acknowledgment_state, voice_sessions.state) MUST use the Postgres enum types defined in this spec, never free-text.
    invariant: true
  - id: T-SPEC-DATA-005-NC-NC_DATA_003
    kind: negative-constraint
    traces_to: SPEC-DATA-005#NC-DATA-003
    assertion: "The transition-guard trigger MUST fire on both INSERT (rejecting any row whose status/state is not that table's declared initial state: Not Started for deadlines, Open for tasks, Scheduled for reminders, Idle for voice_sessions) and UPDATE (rejecting any forbidden transition declared in SPEC-CORE-005's deadline_assignment/task_lifecycle/reminder machines or SPEC-VOICE-004's voice_session machine) — not left to application code alone."
    invariant: true
  - id: T-SPEC-DATA-005-NC-NC_DATA_004
    kind: negative-constraint
    traces_to: SPEC-DATA-005#NC-DATA-004
    assertion: All due-date, trigger, snooze, delivery, and session expiry timestamp columns MUST use timestamptz, never text or naive timestamp.
    invariant: true
  - id: T-SPEC-DATA-005-NC-NC_DATA_005
    kind: negative-constraint
    traces_to: SPEC-DATA-005#NC-DATA-005
    assertion: Courses, Deadlines, Tasks, and Notes rows MUST be soft-deleted (deleted_at set) rather than removed via SQL DELETE; application code MUST NOT issue a hard DELETE against these tables. Operationalizes SPEC-CORE-005's NC-008.
    invariant: true
  - id: T-SPEC-DATA-005-NC-NC_DATA_006
    kind: negative-constraint
    traces_to: SPEC-DATA-005#NC-DATA-006
    assertion: notes.linked_course_id and notes.linked_task_id MUST use ON DELETE SET NULL as a defensive backstop, even though the primary unlink path is the SPEC-API-004 soft-delete cascade (NC-DATA-005 means a real DELETE, and thus this FK action, should never actually fire in normal operation).
    invariant: true
  - id: T-SPEC-DATA-005-NC-NC_DATA_007
    kind: negative-constraint
    traces_to: SPEC-DATA-005#NC-DATA-007
    assertion: List/get queries against courses, deadlines, tasks, and notes MUST filter deleted_at IS NULL by default. Operationalizes SPEC-CORE-005 AC-010.
    invariant: true
  - id: T-SPEC-DATA-005-NC-NC_DATA_008
    kind: negative-constraint
    traces_to: SPEC-DATA-005#NC-DATA-008
    assertion: The reminder-dispatch query MUST exclude any reminder whose target Deadline or Task has deleted_at set, as a backstop to the target_soft_deleted cascade. Operationalizes SPEC-CORE-005's NC-009.
    invariant: true
