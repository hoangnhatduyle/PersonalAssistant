  - id: T-SPEC-DATA-010-NC-NC_DATA_001
    kind: negative-constraint
    traces_to: SPEC-DATA-010#NC-DATA-001
    assertion: Every table holding user data MUST have a user_id column enforced via Row Level Security restricting rows to auth.uid() = user_id; no such table may be queried with RLS disabled.
    invariant: true
  - id: T-SPEC-DATA-010-NC-NC_DATA_002
    kind: negative-constraint
    traces_to: SPEC-DATA-010#NC-DATA-002
    assertion: Status/state columns (deadlines.status, tasks.status, reminders.acknowledgment_state, voice_sessions.state) MUST use the Postgres enum types defined in this spec, never free-text.
    invariant: true
  - id: T-SPEC-DATA-010-NC-NC_DATA_003
    kind: negative-constraint
    traces_to: SPEC-DATA-010#NC-DATA-003
    assertion: "The transition-guard trigger MUST fire on both INSERT (rejecting any row whose status/state is not that table's declared initial state: Not Started for deadlines, Open for tasks, Scheduled for reminders, Idle for voice_sessions) and UPDATE (rejecting any forbidden transition declared in SPEC-CORE-007's deadline_assignment/task_lifecycle/reminder machines or SPEC-VOICE-005's voice_session machine) — not left to application code alone."
    invariant: true
  - id: T-SPEC-DATA-010-NC-NC_DATA_004
    kind: negative-constraint
    traces_to: SPEC-DATA-010#NC-DATA-004
    assertion: All due-date, trigger, snooze, delivery, and session expiry timestamp columns MUST use timestamptz, never text or naive timestamp.
    invariant: true
  - id: T-SPEC-DATA-010-NC-NC_DATA_005
    kind: negative-constraint
    traces_to: SPEC-DATA-010#NC-DATA-005
    assertion: Courses, Deadlines, Tasks, and Notes rows MUST be soft-deleted (deleted_at set) rather than removed via SQL DELETE; application code MUST NOT issue a hard DELETE against these tables. Operationalizes SPEC-CORE-007's NC-008.
    invariant: true
  - id: T-SPEC-DATA-010-NC-NC_DATA_006
    kind: negative-constraint
    traces_to: SPEC-DATA-010#NC-DATA-006
    assertion: notes.linked_course_id and notes.linked_task_id MUST use ON DELETE SET NULL as a defensive backstop, even though the primary unlink path is the SPEC-API-006 soft-delete cascade (NC-DATA-005 means a real DELETE, and thus this FK action, should never actually fire in normal operation).
    invariant: true
  - id: T-SPEC-DATA-010-NC-NC_DATA_007
    kind: negative-constraint
    traces_to: SPEC-DATA-010#NC-DATA-007
    assertion: List/get queries against courses, deadlines, tasks, and notes MUST filter deleted_at IS NULL by default. Operationalizes SPEC-CORE-007 AC-010.
    invariant: true
  - id: T-SPEC-DATA-010-NC-NC_DATA_008
    kind: negative-constraint
    traces_to: SPEC-DATA-010#NC-DATA-008
    assertion: The reminder-dispatch query MUST exclude any reminder whose target Deadline or Task has deleted_at set, as a backstop to the target_soft_deleted cascade. Operationalizes SPEC-CORE-007's NC-009.
    invariant: true
  - id: T-SPEC-DATA-010-NC-NC_DATA_009
    kind: negative-constraint
    traces_to: SPEC-DATA-010#NC-DATA-009
    assertion: voice_sessions rows MUST NOT be retained past 24 hours from ended_at (or from started_at, for a session that never reaches a terminal state); the retention-sweep function MUST perform a hard DELETE, not a soft-delete — this table holds no historical-record requirement distinguishing it from Courses/Deadlines/Tasks/Notes, and is the one unbounded PII-accumulation path in the schema.
    invariant: true
  - id: T-SPEC-DATA-010-NC-NC_DATA_010
    kind: negative-constraint
    traces_to: SPEC-DATA-010#NC-DATA-010
    assertion: "sweep_expired_feedback() (and only that sweep function — never a user-initiated delete, see NC-DATA-011) MUST NOT retain a feedback row past 180 days from created_at. It MUST perform the aggregate-then-purge as a single atomic statement: one multi-row INSERT INTO feedback_aggregates (user_id, dimension, sample_count, rating_sum, updated_at) ... ON CONFLICT (user_id, dimension) DO UPDATE SET sample_count = feedback_aggregates.sample_count + EXCLUDED.sample_count, rating_sum = feedback_aggregates.rating_sum + EXCLUDED.rating_sum, updated_at = now(), whose source SELECT reads from a DELETE FROM feedback WHERE created_at < now() - interval '180 days' RETURNING user_id, target_type, rating grouped by (user_id, target_type) — never a separate SELECT-then-INSERT-then-DELETE sequence, which would let two overlapping sweep runs double-count the same rows."
    invariant: true
  - id: T-SPEC-DATA-010-NC-NC_DATA_011
    kind: negative-constraint
    traces_to: SPEC-DATA-010#NC-DATA-011
    assertion: A user-initiated feedback deletion MUST be a hard DELETE executed immediately against the specific row (not queued for the 180-day sweep, not soft-deleted), scoped to that user via RLS like every other user-owned table, and MUST NOT write anything to feedback_aggregates — a user erasing their own feedback must not have it folded into a permanent aggregate as a side effect of that same request.
    invariant: true
  - id: T-SPEC-DATA-010-NC-NC_DATA_012
    kind: negative-constraint
    traces_to: SPEC-DATA-010#NC-DATA-012
    assertion: "feedback_aggregates MUST be SELECT-only for the authenticated/anon roles: an RLS SELECT policy scoped to auth.uid() = user_id, no INSERT/UPDATE/DELETE policy, and an explicit revoke insert, update, delete on public.feedback_aggregates from anon, authenticated (RLS-denies-by-default is not treated as sufficient on its own, matching the explicit-revoke stance 0001_init.sql already takes for its active_* views). The only writer is sweep_expired_feedback(), a SECURITY DEFINER function whose EXECUTE privilege MUST be revoked from public/anon/authenticated and granted only to the role pg_cron invokes it as (mirroring the SECURITY DEFINER lockdown 0001_init.sql applies to dispatch_due_reminders() and 0004_voice_session_retention.sql applies to delete_expired_voice_sessions()) — without both the EXECUTE revoke and a non-row-returning signature (returns integer affected-row-count, or void; never setof public.feedback), any authenticated caller could invoke the sweep directly, either forcing an early purge or, if it followed the setof-returning shape of the other two sweep functions, reading every other user's feedback.comment text through the RPC."
    invariant: true
  - id: T-SPEC-DATA-010-NC-NC_DATA_013
    kind: negative-constraint
    traces_to: SPEC-DATA-010#NC-DATA-013
    assertion: A BEFORE INSERT OR UPDATE trigger on feedback MUST verify that target_id references an existing row of the declared target_type (deadline/task/reminder) owned by feedback.user_id, rejecting the write otherwise — mirrors the existing trg_guard_reminder_target_ownership trigger that guards reminders.target_id/target_type against the same polymorphic-reference-with-no-real-FK shape.
    invariant: true
