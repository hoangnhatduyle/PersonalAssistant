cases:
  - id: T-SPEC-DATA-010-AC-AC_1
    kind: acceptance
    traces_to: SPEC-DATA-010#AC-1
    assertion: given a deadline, task, reminder, or voice_session row, when an INSERT specifies a status/state other than that table's declared initial state, or an UPDATE attempts a forbidden transition, then the transaction is rejected by the database trigger, not merely by application-layer logic
    invariant: true
  - id: T-SPEC-DATA-010-AC-AC_2
    kind: acceptance
    traces_to: SPEC-DATA-010#AC-2
    assertion: given two different authenticated users, each with their own rows across courses/deadlines/tasks/notes/reminders/voice_sessions/feedback/feedback_aggregates, when user A queries any of these tables, then no row belonging to user B is ever returned, enforced by RLS rather than by query-time filtering alone
    invariant: true
  - id: T-SPEC-DATA-010-AC-AC_3
    kind: acceptance
    traces_to: SPEC-DATA-010#AC-3
    assertion: given a reminder row that is either (a) Scheduled with trigger_at in the past, or (b) Snoozed with snooze_until in the past, and whose target Deadline/Task is not soft-deleted, when the reminder-dispatch query runs, then the row is selected for delivery, transitions to Delivered, and delivered_at is set
    invariant: true
  - id: T-SPEC-DATA-010-AC-AC_4
    kind: acceptance
    traces_to: SPEC-DATA-010#AC-4
    assertion: given a voice_sessions row in AwaitingConfirmation with a pending_mutation payload and a non-null expires_at in the future, when a subsequent, separate HTTP request reads that row by its id before expires_at, then the same pending_mutation payload is available to execute or discard
    invariant: true
  - id: T-SPEC-DATA-010-AC-AC_5
    kind: acceptance
    traces_to: SPEC-DATA-010#AC-5
    assertion: given a user requests deletion of a course, deadline, task, or note, when the deletion is processed, then the row's deleted_at is set and it remains queryable only via an explicit include-deleted query; never removed from the table
    invariant: true
  - id: T-SPEC-DATA-010-AC-AC_6
    kind: acceptance
    traces_to: SPEC-DATA-010#AC-6
    assertion: given an ordinary (non-include-deleted) list or get query against courses, deadlines, tasks, or notes, when the query executes, then no row with deleted_at set is returned
    invariant: true
  - id: T-SPEC-DATA-010-AC-AC_7
    kind: acceptance
    traces_to: SPEC-DATA-010#AC-7
    assertion: given a Scheduled or Snoozed reminder whose target Deadline or Task is soft-deleted, when the target's deleted_at is set, then the reminder transitions to Dismissed, and the dispatch query's deleted_at IS NULL filter independently ensures it is never delivered even if the cascade were missed
    invariant: true
  - id: T-SPEC-DATA-010-AC-AC_8
    kind: acceptance
    traces_to: SPEC-DATA-010#AC-8
    assertion: given a Delivered reminder with delivered_at more than 60 minutes in the past and acknowledgment_state still Delivered, when the dispatch sweep runs, then it transitions to Expired
    invariant: true
  - id: T-SPEC-DATA-010-AC-AC_9
    kind: acceptance
    traces_to: SPEC-DATA-010#AC-9
    assertion: given a voice_sessions row whose ended_at (or, for a row that never reached a terminal state, started_at) is more than 24 hours in the past, when the retention-sweep function runs, then the row is hard-deleted in full (transcript, resolved_intent, confidence_score, and pending_mutation all removed) rather than soft-deleted or retained for browsing
    invariant: true
  - id: T-SPEC-DATA-010-AC-AC_10
    kind: acceptance
    traces_to: SPEC-DATA-010#AC-10
    assertion: given a user submits feedback on a Deadline, Task, or Reminder instance they own, when the submission is processed, then a feedback row is inserted carrying target_type/target_id/rating/created_at, scoped to the submitting user; the database rejects the insert if target_id does not reference an existing row of target_type owned by that same user (NC-DATA-013); and the submission is never silently dropped — operationalizes SPEC-CORE-007 AC-004
    invariant: true
  - id: T-SPEC-DATA-010-AC-AC_11
    kind: acceptance
    traces_to: SPEC-DATA-010#AC-11
    assertion: given one or more feedback rows whose created_at is more than 180 days in the past, when sweep_expired_feedback() runs, then each (user_id, target_type) group's rows are deleted and their count/rating-sum contribution upserted into the matching feedback_aggregates row in the same statement, per NC-DATA-010, and feedback_aggregates.updated_at is advanced to now() as part of that same DO UPDATE
    invariant: true
  - id: T-SPEC-DATA-010-AC-AC_12
    kind: acceptance
    traces_to: SPEC-DATA-010#AC-12
    assertion: given a user requests deletion of one of their own feedback rows before its 180-day window elapses, when the deletion is processed, then the row is hard-deleted immediately if it exists and is owned by that user (the delete asserts rows-affected and surfaces not-found/forbidden on zero, mirroring SPEC-API-006 AC-4), is excluded from any future aggregation, and never contributes to feedback_aggregates per NC-DATA-011
    invariant: true
