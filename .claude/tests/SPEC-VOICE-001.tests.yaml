cases:
  - id: T-SPEC-VOICE-001-AC-AC_1
    kind: acceptance
    traces_to: SPEC-VOICE-001#AC-1
    assertion: given a resolved intent with confidence at or above the accuracy bar for a read-only query, when read_only_query_resolved fires, then the session moves directly to Executing without requiring confirmation, and Responding begins within the p95 2.5s budget
    invariant: true
  - id: T-SPEC-VOICE-001-AC-AC_2
    kind: acceptance
    traces_to: SPEC-VOICE-001#AC-2
    assertion: given a resolved intent that is mutating (create/update/delete a Deadline, Task, or Note), when mutating_action_resolved fires, then the session moves to AwaitingConfirmation and does not execute until user_confirms is received
    invariant: true
  - id: T-SPEC-VOICE-001-AC-AC_3
    kind: acceptance
    traces_to: SPEC-VOICE-001#AC-3
    assertion: given a transcript whose resolved-intent confidence is below the accuracy bar, when intent_ambiguous_or_low_confidence fires, then the session asks a clarifying question via Responding rather than guessing, and the underlying entity is left unmodified
    invariant: true
  - id: T-SPEC-VOICE-001-AC-AC_4
    kind: acceptance
    traces_to: SPEC-VOICE-001#AC-4
    assertion: given the Listening step has completed and Transcribing has produced a transcript, when the session proceeds past Transcribing, then the raw audio captured during Listening is discarded and only the transcript and derived intent persist
    invariant: true
  - id: T-SPEC-VOICE-001-AC-AC_5
    kind: acceptance
    traces_to: SPEC-VOICE-001#AC-5
    assertion: given a session in AwaitingConfirmation, when user_declines fires, then no entity is created or modified, and the session responds with an acknowledgment of the cancellation
    invariant: true
  - id: T-SPEC-VOICE-001-FORBID-voice_session_Executing_Idle
    kind: forbidden-transition
    traces_to: SPEC-VOICE-001#voice_session:Executing->Idle
    assertion: "[voice_session] transition Executing -> Idle MUST be rejected (execution must never complete silently; it must always pass through Responding so the user is told what happened, success or failure)"
    invariant: true
  - id: T-SPEC-VOICE-001-FORBID-voice_session_Transcribing_Executing
    kind: forbidden-transition
    traces_to: SPEC-VOICE-001#voice_session:Transcribing->Executing
    assertion: "[voice_session] transition Transcribing -> Executing MUST be rejected (no intent may be executed before it has been resolved and, if mutating, explicitly confirmed — skipping straight from raw transcription to execution would bypass the NC-002 confirmation requirement entirely)"
    invariant: true
  - id: T-SPEC-VOICE-001-FORBID-voice_session_Idle_Executing
    kind: forbidden-transition
    traces_to: SPEC-VOICE-001#voice_session:Idle->Executing
    assertion: "[voice_session] transition Idle -> Executing MUST be rejected (nothing may execute outside an active session; guards against a stray or replayed execution event firing with no live session context)"
    invariant: true
  - id: T-SPEC-VOICE-001-NC-NC_VOICE_001
    kind: negative-constraint
    traces_to: SPEC-VOICE-001#NC-VOICE-001
    assertion: An intent with external-world or data-mutating effects MUST NOT execute without first passing through AwaitingConfirmation and receiving user_confirms — operationalizes SPEC-CORE-001's NC-002 at the session-lifecycle level.
    invariant: true
  - id: T-SPEC-VOICE-001-NC-NC_VOICE_002
    kind: negative-constraint
    traces_to: SPEC-VOICE-001#NC-VOICE-002
    assertion: A session MUST NOT proceed on a resolved intent whose confidence score is below the recorded ≥95% first-try accuracy bar; below threshold it MUST route to IntentAmbiguous and ask for clarification rather than guess — operationalizes NC-004.
    invariant: true
  - id: T-SPEC-VOICE-001-NC-NC_VOICE_003
    kind: negative-constraint
    traces_to: SPEC-VOICE-001#NC-VOICE-003
    assertion: Raw voice audio captured during Listening MUST NOT be persisted past the Transcribing step; only the resulting transcript and resolved intent may be retained, per the recorded feedback-retention decision.
    invariant: true
